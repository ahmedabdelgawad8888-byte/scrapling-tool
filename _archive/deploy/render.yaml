# Render Blueprint — one-click deploy for Scrapling Tool
# https://render.com/docs/blueprint-spec
#
# Uses Dockerfile.render, which omits Chromium: the free instance has 512MB,
# and a browser would not fit. HTTP mode is what runs here.
services:
  - type: web
    name: scrapling-tool
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Free instances have an ephemeral filesystem, so the SQLite store resets
      # on every restart and after each idle spin-down. Either attach a disk
      # (paid) and point this at it, or set SUPABASE_DB_URL below — which keeps
      # history off the instance entirely and costs nothing here.
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SCRAPEGRAPH_API_KEY
        sync: false
      - key: SCRAPLING_DATA_DIR
        value: /app
      # Postgres connection string for run history and schedules. Set it in the
      # Render dashboard, not here: it carries the database password.
      - key: SUPABASE_DB_URL
        sync: false
