name: Tests (tox)

# `ci.yml` is the PR gate. This lane exists so the tox configuration developers
# run locally is exercised too, plus the browser-backed `live` tests that are
# too slow and too flaky (they hit real sites) to gate every push on.
#
# It previously ran upstream Scrapling's tox environments against a package
# this fork no longer vendors, and cached on a hardcoded upstream runner path
# (/Users/runner/work/Scrapling/pyproject.toml), so it never passed.

on:
  schedule:
    - cron: '17 4 * * 1'  # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      run-live:
        description: 'Also run the network-backed `live` tests'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            tox.ini

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tests
        run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d .)

  live:
    name: live (network-backed)
    if: github.event_name == 'workflow_dispatch' && inputs.run-live
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run live tests
        run: tox -e live
