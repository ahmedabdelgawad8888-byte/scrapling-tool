# Tox (https://tox.wiki/) runs this project's test suite across the supported
# Python versions. Install with "pip install tox" and run "tox" here.
#
# The previous configuration was upstream Scrapling's: it ran `changedir=tests`,
# measured `--cov=scrapling` (a package this fork no longer vendors), installed
# `extras = ai,shell` (which do not exist in this pyproject.toml) and pulled in
# tests/requirements.txt. Every environment failed before collecting a test.

[tox]
envlist = lint,py{310,311,312,313}
isolated_build = True

[testenv]
usedevelop = True
extras = all
deps =
    pytest>=8.0,<9
    pytest-asyncio>=0.23,<1
    pytest-cov>=5.0,<7
# testpaths in pyproject.toml scopes this to tests/scrapling_tool. The suite is
# offline by design; anything needing the network is marked `live`.
commands =
    pytest -q -m "not live" --cov=scrapling_tool --cov-report=term-missing --cov-report=xml {posargs}

[testenv:lint]
skip_install = True
deps = ruff>=0.6
commands = ruff check .

[testenv:live]
# Opt-in lane for the network-backed tests: `tox -e live`.
usedevelop = True
extras = all
deps = {[testenv]deps}
commands = pytest -q -m live {posargs}
